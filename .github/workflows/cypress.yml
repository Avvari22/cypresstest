name: Cypress Tests & Allure Report

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  cypress:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Set up Java (Required for Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        id: cypress_tests
        continue-on-error: true
        run: npm run cy:run

      - name: Verify Allure results
        run: |
          echo "Checking Allure result files..."
          if [ ! -d "allure-results" ]; then
            echo "::warning::allure-results directory missing"
            mkdir -p allure-results
          fi

          COUNT=$(find allure-results -name '*-result.json' | wc -l)
          echo "Allure test results count: $COUNT"

      - name: Install Allure CLI
        run: npm install -g allure-commandline

      - name: Generate Allure Report
        run: allure generate allure-results --clean -o allure-report

      - name: Upload Allure Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: |
            allure-report/
            allure-results/
          retention-days: 30
          if-no-files-found: warn

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: allure-report/

      - name: Deploy Allure Report to Pages
        if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Allure Report Link
        if: github.event_name != 'pull_request' && vars.DEPLOY_GITHUB_PAGES == 'true'
        env:
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Allure Report URL: $REPORT_URL"
          echo "## Cypress Automation - Allure Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Test Execution Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[View Allure Report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Report URL: $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if tests failed
        if: steps.cypress_tests.outcome == 'failure'
        run: |
          echo "::error::Cypress tests failed"
          exit 1